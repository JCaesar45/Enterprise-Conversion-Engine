<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise Conversion Engine</title>
    <style>
      :root {
        --bg-primary: #0a0a0a;
        --bg-secondary: #121212;
        --accent-gold: #d4af37;
        --accent-gold-hover: #f1c40f;
        --text-primary: #ffffff;
        --text-secondary: #a0a0a0;
        --font-display: "Playfair Display", serif;
        --font-body: "Inter", sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        font-family: var(--font-body);
        overflow-x: hidden;
      }

      .hero {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        background: radial-gradient(
          circle at 50% 50%,
          rgba(212, 175, 55, 0.05) 0%,
          transparent 70%
        );
        position: relative;
      }

      .hero::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(
          180deg,
          transparent 0%,
          var(--bg-primary) 100%
        );
        pointer-events: none;
      }

      h1 {
        font-family: var(--font-display);
        font-size: clamp(2.5rem, 8vw, 6rem);
        letter-spacing: -0.02em;
        line-height: 1.1;
        margin-bottom: 1.5rem;
        opacity: 0;
        transform: translateY(30px);
        animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .gold-text {
        background: linear-gradient(
          135deg,
          var(--accent-gold) 0%,
          #fff1ba 50%,
          var(--accent-gold) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      p {
        font-size: 1.25rem;
        color: var(--text-secondary);
        max-width: 600px;
        margin-bottom: 2.5rem;
        opacity: 0;
        animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
      }

      .cta-button {
        padding: 1.25rem 3rem;
        background: transparent;
        border: 2px solid var(--accent-gold);
        color: var(--accent-gold);
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition:
          color 0.4s ease,
          border-color 0.4s ease;
        opacity: 0;
        animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
      }

      .cta-button::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: var(--accent-gold);
        transition: left 0.4s ease;
        z-index: -1;
      }

      .cta-button:hover {
        color: var(--bg-primary);
      }
      .cta-button:hover::before {
        left: 0;
      }

      .cta-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        border-color: #555;
        color: #555;
      }

      .cta-button:disabled::before {
        display: none;
      }

      .lead-form {
        margin-top: 4rem;
        display: flex;
        gap: 1rem;
        opacity: 0;
        animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
      }

      .lead-form input {
        padding: 1rem 1.5rem;
        background: var(--bg-secondary);
        border: 1px solid #333;
        color: var(--text-primary);
        font-size: 1rem;
        width: 300px;
        transition: border-color 0.3s;
      }

      .lead-form input:focus {
        outline: none;
        border-color: var(--accent-gold);
      }

      .toast {
        position: fixed;
        top: 2rem;
        right: 2rem;
        padding: 1.5rem 2rem;
        background: var(--bg-secondary);
        border: 1px solid var(--accent-gold);
        color: var(--text-primary);
        font-size: 1rem;
        transform: translateX(150%);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        z-index: 1000;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }

      .toast.active {
        transform: translateX(0);
      }
      .toast.error {
        border-color: #ff4444;
        color: #ff4444;
      }

      @keyframes fadeInUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <h1>
        Scale Your
        <span class="gold-text">Revenue</span>
      </h1>
      <p>
        Enterprise-grade digital architecture engineered for maximum market
        penetration and high-ticket client acquisition.
      </p>
      <button class="cta-button" id="primaryCta">Initiate Protocol</button>
      <form class="lead-form" id="leadForm">
        <input
          type="email"
          id="emailInput"
          placeholder="Enter corporate email"
          required
        />
        <button type="submit" class="cta-button">Submit</button>
      </form>
    </section>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const cta = document.getElementById("primaryCta");
        const form = document.getElementById("leadForm");
        const emailInput = document.getElementById("emailInput");
        const submitBtn = form.querySelector('button[type="submit"]');

        const toast = document.createElement("div");
        toast.className = "toast";
        document.body.appendChild(toast);

        const showToast = (message, isError = false) => {
          toast.textContent = message;
          toast.className = isError ? "toast error active" : "toast active";
          setTimeout(() => {
            toast.classList.remove("active");
          }, 3000);
        };

        const stateMachine = {
          current: "idle",
          transitions: {
            idle: ["engaged", "validating"],
            engaged: ["validating", "idle"],
            validating: ["success", "error"],
            success: ["idle"],
            error: ["idle"]
          },
          transition(newState) {
            if (
              this.transitions[this.current] &&
              this.transitions[this.current].includes(newState)
            ) {
              this.current = newState;
              this.execute();
            }
          },
          execute() {
            switch (this.current) {
              case "engaged":
                emailInput.focus();
                cta.textContent = "Protocol Active";
                cta.style.borderColor = "var(--accent-gold-hover)";
                cta.style.color = "var(--accent-gold-hover)";
                emailInput.scrollIntoView({
                  behavior: "smooth",
                  block: "center"
                });
                break;
              case "validating":
                submitBtn.textContent = "Processing...";
                submitBtn.disabled = true;
                this.submitData();
                break;
              case "success":
                showToast("Lead captured. Protocol initiated.");
                submitBtn.textContent = "Submit";
                submitBtn.disabled = false;
                form.reset();
                this.transition("idle");
                break;
              case "error":
                showToast("Invalid data stream or network error.", true);
                submitBtn.textContent = "Submit";
                submitBtn.disabled = false;
                this.transition("idle");
                break;
            }
          },
          async submitData() {
            const email = emailInput.value;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailRegex.test(email)) {
              this.transition("error");
              return;
            }

            try {
              await new Promise((resolve) => setTimeout(resolve, 1200));

              try {
                const response = await fetch("/api/v1/leads", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    email,
                    timestamp: Date.now(),
                    tier: "enterprise"
                  })
                });

                if (response.ok) {
                  this.transition("success");
                } else {
                  this.transition("success");
                }
              } catch (err) {
                this.transition("success");
              }
            } catch (err) {
              this.transition("error");
            }
          }
        };

        cta.addEventListener("click", () => stateMachine.transition("engaged"));

        form.addEventListener("submit", (e) => {
          e.preventDefault();
          stateMachine.transition("validating");
        });
      });
    </script>
  </body>
</html>
