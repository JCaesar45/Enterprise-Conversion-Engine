<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise Conversion Engine</title>
    <style>
      :root {
        --bg-primary: #0a0a0a;
        --bg-secondary: #121212;
        --accent-gold: #d4af37;
        --accent-gold-hover: #f1c40f;
        --text-primary: #ffffff;
        --text-secondary: #a0a0a0;
        --font-display: "Playfair Display", serif;
        --font-body: "Inter", sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        font-family: var(--font-body);
        overflow-x: hidden;
      }

      .hero {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        background: radial-gradient(
          circle at 50% 50%,
          rgba(212, 175, 55, 0.05) 0%,
          transparent 70%
        );
        position: relative;
      }

      .hero::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(
          180deg,
          transparent 0%,
          var(--bg-primary) 100%
        );
        pointer-events: none;
      }

      h1 {
        font-family: var(--font-display);
        font-size: clamp(2.5rem, 8vw, 6rem);
        letter-spacing: -0.02em;
        line-height: 1.1;
        margin-bottom: 1.5rem;
        opacity: 0;
        transform: translateY(30px);
        animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .gold-text {
        background: linear-gradient(
          135deg,
          var(--accent-gold) 0%,
          #fff1ba 50%,
          var(--accent-gold) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      p {
        font-size: 1.25rem;
        color: var(--text-secondary);
        max-width: 600px;
        margin-bottom: 2.5rem;
        opacity: 0;
        animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
      }

      .cta-button {
        padding: 1.25rem 3rem;
        background: transparent;
        border: 2px solid var(--accent-gold);
        color: var(--accent-gold);
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: color 0.4s ease;
        opacity: 0;
        animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
      }

      .cta-button::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: var(--accent-gold);
        transition: left 0.4s ease;
        z-index: -1;
      }

      .cta-button:hover {
        color: var(--bg-primary);
      }
      .cta-button:hover::before {
        left: 0;
      }

      .lead-form {
        margin-top: 4rem;
        display: flex;
        gap: 1rem;
        opacity: 0;
        animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
      }

      .lead-form input {
        padding: 1rem 1.5rem;
        background: var(--bg-secondary);
        border: 1px solid #333;
        color: var(--text-primary);
        font-size: 1rem;
        width: 300px;
        transition: border-color 0.3s;
      }

      .lead-form input:focus {
        outline: none;
        border-color: var(--accent-gold);
      }

      @keyframes fadeInUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <h1>
        Scale Your
        <span class="gold-text">Revenue</span>
      </h1>
      <p>
        Enterprise-grade digital architecture engineered for maximum market
        penetration and high-ticket client acquisition.
      </p>
      <button class="cta-button" id="primaryCta">Initiate Protocol</button>
      <form class="lead-form" id="leadForm">
        <input
          type="email"
          id="emailInput"
          placeholder="Enter corporate email"
          required
        />
        <button type="submit" class="cta-button">Submit</button>
      </form>
    </section>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const cta = document.getElementById("primaryCta");
        const form = document.getElementById("leadForm");
        const emailInput = document.getElementById("emailInput");

        const stateMachine = {
          current: "idle",
          transitions: {
            idle: ["engaged"],
            engaged: ["validating", "idle"],
            validating: ["success", "error"],
            success: ["idle"],
            error: ["idle"]
          },
          transition(newState) {
            if (this.transitions[this.current].includes(newState)) {
              this.current = newState;
              this.execute();
            }
          },
          execute() {
            switch (this.current) {
              case "engaged":
                emailInput.focus();
                break;
              case "validating":
                this.submitData();
                break;
              case "success":
                this.showNotification("Lead captured. Protocol initiated.");
                break;
              case "error":
                this.showNotification("Invalid data stream.");
                break;
            }
          },
          async submitData() {
            const email = emailInput.value;
            const payload = {
              email,
              timestamp: Date.now(),
              tier: "enterprise"
            };

            try {
              const response = await fetch("/api/v1/leads", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
              });
              if (response.ok) {
                this.transition("success");
              } else {
                this.transition("error");
              }
            } catch (err) {
              this.transition("error");
            }
          },
          showNotification(message) {
            console.log(`[SYSTEM]: ${message}`);
            this.transition("idle");
          }
        };

        cta.addEventListener("click", () => stateMachine.transition("engaged"));

        form.addEventListener("submit", (e) => {
          e.preventDefault();
          stateMachine.transition("validating");
        });

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("visible");
              }
            });
          },
          { threshold: 0.1 }
        );

        document
          .querySelectorAll("section")
          .forEach((section) => observer.observe(section));
      });
    </script>
  </body>
</html>
